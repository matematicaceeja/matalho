<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Layout de Cards</title>
<style>
  :root{
    --bg: #e6e0e3;         /* fundo da página */
    --card: #ffffff;       /* cor dos cards */
    --accent: #0e8a6b;     /* detalhe */
    --radius: 18px;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  }

  /* container central */
  .centro{
    position: absolute;
    top: 50%;
    left: 50%;
    height: 95vh;                 /* 95% da altura */
    width: calc(100vw - 10vh);    /* 5vh de margem em cada lado */
    transform: translate(-50%,-50%);
    display: grid;
    place-items: center;
  }

  /* grade dos cards */
  .grid{
    width: 100%;
    height: 100%;
    display: grid;
    gap: 24px;
    grid-template-columns: 1.15fr 1fr 1.1fr; /* proporções aproximadas da imagem */
    grid-template-rows: 0.95fr 0.8fr;        /* 2 linhas */
    grid-template-areas:
      "promo painel mapa"
      "ticket ticket pro";
  }

  /* base para qualquer card */
  .card{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 10px 24px rgba(0,0,0,.08);
    position: relative;
    overflow: hidden;
  }

  /* cards e áreas */
  .promo  { grid-area: promo;  }
  .painel { grid-area: painel; }
  .mapa   { grid-area: mapa;   }
  .ticket { grid-area: ticket; }
  .pro    { grid-area: pro;    }

  /* enfeites mínimos para lembrar o layout */
  .badge{
    position: absolute; inset: 16px auto auto 16px;
    height: 28px; width: 72px; border-radius: 999px;
    background: #000; opacity: .85;
  }
  .cta{
    position: absolute; right: 16px; bottom: 16px;
    height: 40px; width: 40px; border-radius: 12px;
    background: #f5f5f5;
  }
  .thumb{
    position: absolute; left: 16px; right: 16px; bottom: 16px; height: 40%;
    background: linear-gradient(180deg,#e8d4cf,#d9c5c1);
    border-radius: 14px;
  }
  .pill{
    position: absolute; left: 16px; right: 16px; bottom: 16px; height: 56px;
    background: #f7f7f8; border-radius: 14px;
  }
  .ring{
    position: absolute; right: 18px; top: 18px;
    height: 52px; width: 52px; border-radius: 50%;
    border: 4px solid #222; box-sizing: border-box;
  }
  .ring::after{
    content: ""; position: absolute; inset: 6px;
    border-radius: 50%; border: 4px solid var(--accent); clip-path: inset(0 30% 0 0);
  }
  .mapa::before{
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(100px 70px at 70% 35%, #c7b9b9 30%, transparent 31%),
      radial-gradient(120px 90px at 30% 65%, #c7b9b9 30%, transparent 31%),
      #f4f4f5;
    opacity: .9;
  }
  .qr{
    position: absolute; left: 24px; top: 24px; height: 120px; width: 120px;
    background:
      linear-gradient(90deg,#000 50%,transparent 0) 0 0/20px 20px,
      linear-gradient(#000 50%,transparent 0) 0 0/20px 20px;
    filter: contrast(130%);
    border-radius: 8px;
  }
  .ticket{
    display: grid; grid-template-columns: 1.1fr 2fr; align-items: stretch;
  }
  .ticket .left{ position: relative; }
  .ticket .right{ position: relative; }
  .ticket .stub{
    position: absolute; top: 50%; left: -10px; transform: translateY(-50%);
    height: 22px; width: 22px; background: var(--bg); border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .ticket .stub.r{ left: auto; right: -10px; }
  .btn{
    position: absolute; right: 20px; bottom: 20px;
    padding: 12px 18px; border-radius: 14px; background: var(--accent);
  }
  .pro{ background: radial-gradient(120% 120% at 0% 0%, #1a9a7a, #0a5a47); color:#fff; }
  .pro .btn{ background: #f9b32a; }

  /* responsivo: empilha em telas menores */
  @media (max-width: 1100px){
    .grid{
      grid-template-columns: 1fr;
      grid-template-rows: repeat(5, minmax(180px, auto));
      grid-template-areas:
        "promo"
        "painel"
        "mapa"
        "ticket"
        "pro";
    }
  }
</style>
</head>
<body>

<div class="centro">
  <div class="grid">
    <div class="card promo">
      <div class="badge"></div>
      <div class="thumb"></div>
      <div class="cta"></div>
    </div>

    <div class="card painel">
      <div class="pill"></div>
      <div class="ring"></div>
    </div>

    <div class="card mapa"></div>

    <div class="card ticket">
      <div class="left">
        <div class="qr"></div>
        <div class="stub"></div>
      </div>
      <div class="right">
        <div class="stub r"></div>
      </div>
    </div>

    <div class="card pro">
      <div class="btn"></div>
    </div>
  </div>
</div>

</body>
</html>
